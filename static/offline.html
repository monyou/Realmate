<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#0b0910" />
		<title>Offline — Realmate</title>
		<style>
			:root {
				font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
				color: #f8f5ff;
				background: #0b0910;
				color-scheme: dark;
			}
			* { box-sizing: border-box; }
			body {
				margin: 0;
				min-width: 320px;
				min-height: 100dvh;
				display: grid;
				place-items: center;
				padding: 24px;
				background:
					radial-gradient(circle at 25% 10%, rgba(124, 92, 255, 0.24), transparent 34%),
					radial-gradient(circle at 80% 90%, rgba(255, 92, 116, 0.18), transparent 34%),
					#0b0910;
			}
			main {
				width: min(100%, 520px);
				padding: 42px 32px;
				text-align: center;
				border: 1px solid rgba(255, 255, 255, 0.1);
				border-radius: 30px;
				background: rgba(24, 20, 31, 0.88);
				box-shadow: 0 28px 90px rgba(0, 0, 0, 0.42);
			}
			.logo {
				display: inline-flex;
				align-items: center;
				gap: 10px;
				font-size: 20px;
				font-weight: 800;
			}
			.reel {
				width: 30px;
				height: 30px;
				border: 3px solid #ff5c74;
				border-radius: 50%;
				box-shadow: 0 0 24px rgba(255, 92, 116, 0.35);
			}
			h1 {
				margin: 34px 0 12px;
				font-size: clamp(38px, 9vw, 58px);
				line-height: 0.96;
				letter-spacing: -0.055em;
			}
			p {
				margin: 0 auto;
				max-width: 390px;
				color: #aaa3b6;
				font-size: 14px;
				line-height: 1.7;
			}
			a {
				display: inline-block;
				margin-top: 28px;
				padding: 13px 20px;
				border-radius: 14px;
				color: #160b10;
				font-size: 14px;
				font-weight: 800;
				text-decoration: none;
				background: linear-gradient(110deg, #ff5c74, #ff7b66);
			}
		</style>
	</head>
	<body>
		<main>
			<div class="logo"><span class="reel" aria-hidden="true"></span>realmate</div>
			<h1>You’re offline</h1>
			<p>
				Realmate needs a connection to load your account, shared lists, and live matching rooms.
				Reconnect and try again.
			</p>
			<a href="/">Try again</a>
		</main>
	</body>
</html>
